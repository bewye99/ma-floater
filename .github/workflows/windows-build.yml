name: Windows build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows:
    name: Native Windows build
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build and verify installer input
        shell: pwsh
        run: ./Build-Installer.ps1

      - name: Run publication checks
        shell: pwsh
        run: ./Test.ps1

      - name: Record unsigned checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'artifacts/installer' -Filter 'MAFloater-Setup-*-x64.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one installer, found $($installers.Count)."
          }
          $files = @(
            'artifacts/win-x64/MAFloater.exe',
            $installers[0].FullName
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $relativePath = [IO.Path]::GetRelativePath((Get-Location).Path, (Resolve-Path -LiteralPath $file).Path)
            "$hash  $relativePath"
          }
          $lines | Set-Content -LiteralPath 'artifacts/SHA256SUMS-unsigned.txt' -Encoding ascii

      - name: Upload unsigned signing inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ma-floater-unsigned-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/win-x64/MAFloater.exe
            artifacts/installer/MAFloater-Setup-*-x64.exe
            artifacts/SHA256SUMS-unsigned.txt
